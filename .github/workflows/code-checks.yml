name: Code checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
      - run: physedit --help
      - run: python score_pairs.py --input examples/pair_endpoints.synthetic.jsonl.gz --expected examples/pair_scores.synthetic.csv --output scores.csv
